<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 320" width="900" height="320">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0d1117"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4f8ef7"/>
      <stop offset="33%" stop-color="#a855f7"/>
      <stop offset="66%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#4f8ef7"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="320" fill="url(#bg)" rx="12"/>
  <rect width="900" height="3" fill="url(#accent-bar)" rx="1.5"/>

  <!-- Title -->
  <text x="450" y="42" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" fill="#6e7681" letter-spacing="4">ARCHITECTURE</text>

  <!-- Box 1: Pipeline YAML -->
  <rect x="40" y="70" width="160" height="72" rx="10" fill="#111d33" stroke="#2a5090" stroke-width="1.5"/>
  <text x="120" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4f8ef7" letter-spacing="0.5">PIPELINE</text>
  <text x="120" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3">YAML Definition</text>

  <!-- Arrow 1 -->
  <line x1="200" y1="106" x2="240" y2="106" stroke="#30363d" stroke-width="2"/>
  <polygon points="240,101 252,106 240,111" fill="#4f8ef7"/>

  <!-- Box 2: DAG Scheduler -->
  <rect x="255" y="70" width="160" height="72" rx="10" fill="#111d33" stroke="#2a5090" stroke-width="1.5"/>
  <text x="335" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#4f8ef7" letter-spacing="0.5">DAG</text>
  <text x="335" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Scheduler</text>

  <!-- Arrow 2 -->
  <line x1="415" y1="106" x2="455" y2="106" stroke="#30363d" stroke-width="2"/>
  <polygon points="455,101 467,106 455,111" fill="#a855f7"/>

  <!-- Box 3: Extension Runtime -->
  <rect x="470" y="70" width="180" height="72" rx="10" fill="#1a1133" stroke="#5a3090" stroke-width="1.5"/>
  <text x="560" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#a855f7" letter-spacing="0.5">WASM</text>
  <text x="560" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Extension Runtime</text>

  <!-- Arrow 3 -->
  <line x1="650" y1="106" x2="690" y2="106" stroke="#30363d" stroke-width="2"/>
  <polygon points="690,101 702,106 690,111" fill="#3fb950"/>

  <!-- Box 4: Results -->
  <rect x="705" y="70" width="155" height="72" rx="10" fill="#0f1f15" stroke="#1e7030" stroke-width="1.5"/>
  <text x="782" y="100" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#3fb950" letter-spacing="0.5">OUTPUT</text>
  <text x="782" y="120" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Results &amp; Events</text>

  <!-- Vertical connector from Scheduler down -->
  <line x1="335" y1="142" x2="335" y2="178" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Vertical connector from Runtime down -->
  <line x1="560" y1="142" x2="560" y2="178" stroke="#30363d" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Bottom Box 1: Policy Engine -->
  <rect x="255" y="180" width="160" height="64" rx="10" fill="#221a10" stroke="#805020" stroke-width="1.5"/>
  <text x="335" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e08a3c" letter-spacing="0.5">GATE</text>
  <text x="335" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Policy Engine</text>

  <!-- Bottom Box 2: Container Sandbox -->
  <rect x="470" y="180" width="180" height="64" rx="10" fill="#221a10" stroke="#805020" stroke-width="1.5"/>
  <text x="560" y="206" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#e08a3c" letter-spacing="0.5">ISOLATION</text>
  <text x="560" y="226" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#e6edf3">Container Sandbox</text>

  <!-- Extensions bar at bottom -->
  <rect x="140" y="272" width="620" height="32" rx="8" fill="#131025" stroke="#1f1540" stroke-width="1"/>
  <text x="450" y="293" text-anchor="middle" font-family="SF Mono, Fira Code, Cascadia Code, monospace" font-size="11" fill="#8b949e">source/git  ·  build/container  ·  scan/trivy  ·  test/junit  ·  deploy/kubernetes  ·  ...</text>
</svg>
