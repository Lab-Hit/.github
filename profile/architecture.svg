<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" width="900" height="360">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="50%" stop-color="#130e25"/>
      <stop offset="100%" stop-color="#0f0a1e"/>
    </linearGradient>
    <linearGradient id="accent-bar" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="360" fill="url(#bg)" rx="12"/>
  <rect width="900" height="3" fill="url(#accent-bar)" rx="1.5"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="600" fill="#6e7681" letter-spacing="4">ARCHITECTURE</text>

  <!-- Row 1: Pipeline Flow -->

  <!-- Box 1: Pipeline YAML -->
  <rect x="30" y="62" width="150" height="68" rx="10" fill="rgba(96,165,250,0.06)" stroke="rgba(96,165,250,0.25)" stroke-width="1.5"/>
  <text x="105" y="88" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#60a5fa" letter-spacing="0.5">PIPELINE</text>
  <text x="105" y="108" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e6edf3">YAML Definition</text>

  <!-- Arrow 1 -->
  <line x1="180" y1="96" x2="215" y2="96" stroke="#2a2a3d" stroke-width="1.5"/>
  <polygon points="215,92 225,96 215,100" fill="#60a5fa"/>

  <!-- Box 2: DAG Scheduler -->
  <rect x="228" y="62" width="145" height="68" rx="10" fill="rgba(96,165,250,0.06)" stroke="rgba(96,165,250,0.25)" stroke-width="1.5"/>
  <text x="300" y="88" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#60a5fa" letter-spacing="0.5">DAG</text>
  <text x="300" y="108" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e6edf3">Scheduler</text>

  <!-- Arrow 2 -->
  <line x1="373" y1="96" x2="408" y2="96" stroke="#2a2a3d" stroke-width="1.5"/>
  <polygon points="408,92 418,96 408,100" fill="#a78bfa"/>

  <!-- Box 3: Extension Runtime -->
  <rect x="421" y="62" width="160" height="68" rx="10" fill="rgba(167,139,250,0.06)" stroke="rgba(167,139,250,0.25)" stroke-width="1.5"/>
  <text x="501" y="88" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#a78bfa" letter-spacing="0.5">WASM</text>
  <text x="501" y="108" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e6edf3">Extension Runtime</text>

  <!-- Arrow 3 -->
  <line x1="581" y1="96" x2="616" y2="96" stroke="#2a2a3d" stroke-width="1.5"/>
  <polygon points="616,92 626,96 616,100" fill="#4ade80"/>

  <!-- Box 4: Results & Events -->
  <rect x="629" y="62" width="130" height="68" rx="10" fill="rgba(74,222,128,0.06)" stroke="rgba(74,222,128,0.25)" stroke-width="1.5"/>
  <text x="694" y="88" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#4ade80" letter-spacing="0.5">OUTPUT</text>
  <text x="694" y="108" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e6edf3">Results &amp; Events</text>

  <!-- Arrow 4: to Storage -->
  <line x1="759" y1="96" x2="790" y2="96" stroke="#2a2a3d" stroke-width="1.5"/>
  <polygon points="790,92 800,96 790,100" fill="#818cf8"/>

  <!-- Box 5: Storage -->
  <rect x="803" y="62" width="72" height="68" rx="10" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.25)" stroke-width="1.5"/>
  <text x="839" y="88" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#818cf8" letter-spacing="0.5">PERSIST</text>
  <text x="839" y="108" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e6edf3">Storage</text>

  <!-- Row 2: Supporting Systems -->

  <!-- Vertical connectors -->
  <line x1="300" y1="130" x2="300" y2="168" stroke="#2a2a3d" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="501" y1="130" x2="501" y2="168" stroke="#2a2a3d" stroke-width="1.5" stroke-dasharray="4,3"/>
  <line x1="694" y1="130" x2="694" y2="168" stroke="#2a2a3d" stroke-width="1.5" stroke-dasharray="4,3"/>

  <!-- Box: Policy Engine -->
  <rect x="228" y="170" width="145" height="60" rx="10" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>
  <text x="300" y="195" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" letter-spacing="0.5">GATE</text>
  <text x="300" y="215" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e6edf3">Policy Engine</text>

  <!-- Box: Container Sandbox -->
  <rect x="421" y="170" width="160" height="60" rx="10" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>
  <text x="501" y="195" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" letter-spacing="0.5">ISOLATION</text>
  <text x="501" y="215" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e6edf3">Container Sandbox</text>

  <!-- Box: Interpolation Engine -->
  <rect x="629" y="170" width="130" height="60" rx="10" fill="rgba(245,158,11,0.06)" stroke="rgba(245,158,11,0.25)" stroke-width="1.5"/>
  <text x="694" y="195" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" letter-spacing="0.5">VARIABLES</text>
  <text x="694" y="215" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#e6edf3">$&#123;&#123; &#125;&#125; Engine</text>

  <!-- Row 3: GraphQL API -->
  <rect x="228" y="258" width="532" height="40" rx="10" fill="rgba(96,165,250,0.04)" stroke="rgba(96,165,250,0.15)" stroke-width="1"/>
  <text x="494" y="283" text-anchor="middle" font-family="-apple-system, Segoe UI, Helvetica, sans-serif" font-size="10" font-weight="600" fill="#60a5fa" letter-spacing="1">GRAPHQL API  &amp;  EVENT BUS</text>

  <!-- Extensions bar at bottom -->
  <rect x="100" y="316" width="700" height="30" rx="8" fill="rgba(255,255,255,0.02)" stroke="rgba(255,255,255,0.05)" stroke-width="1"/>
  <text x="450" y="335" text-anchor="middle" font-family="SF Mono, Fira Code, Cascadia Code, monospace" font-size="10" fill="#6e7681">source/git  ·  build/container  ·  scan/trivy  ·  test/jest  ·  gate/policy  ·  deploy/k8s  ·  store/sqlite  ·  ...</text>
</svg>
