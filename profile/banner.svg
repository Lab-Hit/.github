<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="900" height="280">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0a1e"/>
      <stop offset="30%" stop-color="#1a1040"/>
      <stop offset="60%" stop-color="#1e0d35"/>
      <stop offset="100%" stop-color="#0f0a1e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="25%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="75%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <radialGradient id="glow1" cx="35%" cy="45%" r="40%">
      <stop offset="0%" stop-color="rgba(245,158,11,0.08)"/>
      <stop offset="100%" stop-color="rgba(245,158,11,0)"/>
    </radialGradient>
    <radialGradient id="glow2" cx="65%" cy="55%" r="40%">
      <stop offset="0%" stop-color="rgba(139,92,246,0.10)"/>
      <stop offset="100%" stop-color="rgba(139,92,246,0)"/>
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#f59e0b" flood-opacity="0.3"/>
    </filter>
    <filter id="softglow">
      <feGaussianBlur in="SourceGraphic" stdDeviation="1"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="900" height="280" fill="url(#bg)" rx="12"/>

  <!-- Top accent bar -->
  <rect width="900" height="3" fill="url(#accent)" rx="1.5"/>

  <!-- Decorative glows -->
  <ellipse cx="315" cy="126" rx="200" ry="120" fill="url(#glow1)"/>
  <ellipse cx="585" cy="154" rx="200" ry="120" fill="url(#glow2)"/>

  <!-- Subtle grid pattern -->
  <line x1="0" y1="70" x2="900" y2="70" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="0" y1="140" x2="900" y2="140" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="0" y1="210" x2="900" y2="210" stroke="rgba(255,255,255,0.02)" stroke-width="1"/>
  <line x1="200" y1="0" x2="200" y2="280" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>
  <line x1="450" y1="0" x2="450" y2="280" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>
  <line x1="700" y1="0" x2="700" y2="280" stroke="rgba(255,255,255,0.015)" stroke-width="1"/>

  <!-- Logo mark -->
  <rect x="374" y="38" width="48" height="48" rx="12" fill="url(#logoGrad)" filter="url(#shadow)"/>
  <text x="386" y="73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="800" fill="#ffffff">L</text>

  <!-- Brand name -->
  <text x="432" y="73" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="34" font-weight="800" fill="url(#textGrad)" letter-spacing="1">LabHit</text>

  <!-- Subtitle -->
  <text x="450" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="11" font-weight="500" fill="#6e7681" letter-spacing="5">THE MODULAR CI/CD ENGINE</text>

  <!-- Tagline -->
  <text x="450" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a09bb0">A minimal core that schedules pipelines.</text>
  <text x="450" y="170" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="400" fill="#a09bb0">An open ecosystem of extensions that do the work.</text>

  <!-- Tech badges -->
  <rect x="148" y="196" width="108" height="28" rx="14" fill="rgba(245,158,11,0.10)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
  <text x="202" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#f59e0b" letter-spacing="0.5">RUST CORE</text>

  <rect x="270" y="196" width="120" height="28" rx="14" fill="rgba(139,92,246,0.10)" stroke="rgba(139,92,246,0.25)" stroke-width="1"/>
  <text x="330" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#a78bfa" letter-spacing="0.5">WASM PLUGINS</text>

  <rect x="404" y="196" width="150" height="28" rx="14" fill="rgba(74,222,128,0.08)" stroke="rgba(74,222,128,0.20)" stroke-width="1"/>
  <text x="479" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#4ade80" letter-spacing="0.5">SECURE BY DEFAULT</text>

  <rect x="568" y="196" width="100" height="28" rx="14" fill="rgba(96,165,250,0.10)" stroke="rgba(96,165,250,0.20)" stroke-width="1"/>
  <text x="618" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#60a5fa" letter-spacing="0.5">GRAPHQL API</text>

  <rect x="682" y="196" width="108" height="28" rx="14" fill="rgba(248,113,113,0.08)" stroke="rgba(248,113,113,0.18)" stroke-width="1"/>
  <text x="736" y="214" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Helvetica, Arial, sans-serif" font-size="10" font-weight="600" fill="#f87171" letter-spacing="0.5">APACHE 2.0</text>

  <!-- Bottom decorative line -->
  <rect x="200" y="252" width="500" height="1" rx="0.5" fill="rgba(255,255,255,0.04)"/>
</svg>
